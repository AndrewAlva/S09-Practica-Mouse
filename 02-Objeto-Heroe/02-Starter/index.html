<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02-starter. (Objeto-Heroe)</title>

  <body>
    <!-- La escena 3D va detrás, con fondo transparente. El texto es HTML normal encima. -->
    <canvas id="lienzo"></canvas>

    <!-- Escribe tu propio texto: nombre del objeto, una frase, una instrucción -->
    <header id="copy">
      <p class="kicker">Objeto 01 · Tu colección</p>
      <h1 class="titulo">Tu objeto.</h1>
      <p class="bajada">Una frase que lo presente.<br>Mueve el cursor.</p>
    </header>

    <aside id="hud">
      <span>norm x <b id="norm-x">0.00</b> · y <b id="norm-y">0.00</b></span>
      <span>rot x <b id="rotation-x">0</b>° · y <b id="rotation-y">0</b>°</span>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
